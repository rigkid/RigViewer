<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RigViewer</title>
	<meta name="description" content="Presents a Rig document — the document is the chrome." />
	<script>
		(function () {
			var q = new URLSearchParams(location.search);
			var e = q.get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
			var edit = q.get("edit");
			if (edit === "1" || edit === "true") document.documentElement.classList.add("edit");
			else if (!document.documentElement.classList.contains("embed"))
				document.documentElement.classList.add("doc");
		})();
	</script>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: #0b0d10;
			color: #e8ecf1;
			font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
		}
		#app {
			position: relative;
			width: 100%;
			height: 100%;
		}
		canvas#tui {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 2;
			touch-action: none;
		}
		canvas#view {
			position: absolute;
			z-index: 3;
			display: block;
			background: #050608;
			touch-action: none;
		}
		html.doc canvas#view,
		html.embed canvas#view {
			inset: 0;
			width: 100%;
			height: 100%;
		}
		html.doc canvas#tui {
			z-index: 5;
			pointer-events: none;
		}
		html.embed canvas#tui { display: none; }
		html.embed .host,
		html.embed #empty,
		html.embed #note { display: none !important; }
		html.edit .host,
		html.edit #empty { display: none !important; }
		#code-host {
			position: absolute;
			z-index: 3;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.92);
			border: 1px solid #2a313c;
		}
		html.doc #code-host { z-index: 6; }
		.host {
			position: absolute;
			top: 0.55rem;
			left: 0.55rem;
			z-index: 8;
			display: flex;
			gap: 0.85rem;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.15s ease;
		}
		html.doc.host-show .host {
			opacity: 1;
		}
		html.doc.host-show .host > * {
			pointer-events: auto;
		}
		html.doc.empty .host { display: none; }
		.host button {
			appearance: none;
			border: 0;
			background: transparent;
			color: rgba(232, 236, 241, 0.55);
			font: inherit;
			font-size: 0.8rem;
			padding: 0;
			cursor: pointer;
		}
		.host button:hover { color: #fff; }
		#host-more {
			position: absolute;
			right: 0.55rem;
			bottom: 0.55rem;
			z-index: 8;
			appearance: none;
			border: 0;
			background: transparent;
			color: rgba(232, 236, 241, 0.35);
			font: inherit;
			font-size: 1.1rem;
			letter-spacing: 0.12em;
			padding: 0.35rem;
			cursor: pointer;
		}
		#host-more:hover { color: rgba(232, 236, 241, 0.8); }
		html.embed #host-more,
		html.edit #host-more,
		html.doc.empty #host-more { display: none !important; }
		#note {
			position: absolute;
			left: 0.55rem;
			bottom: 0.55rem;
			z-index: 8;
			max-width: min(28rem, calc(100% - 3rem));
			padding: 0;
			border: 0;
			background: transparent;
			font-size: 0.78rem;
			color: rgba(232, 236, 241, 0.55);
		}
		#note.warn { color: #d4b06a; }
		#note.err { color: #e88; }
		#empty {
			position: absolute;
			inset: 0;
			z-index: 7;
			display: grid;
			place-content: center;
			background: #0b0d10;
			padding: 2rem;
			cursor: pointer;
		}
		#empty[hidden] { display: none !important; }
		#empty p {
			margin: 0;
			color: rgba(232, 236, 241, 0.4);
			font-size: 0.9rem;
			font-weight: 400;
		}
		#boot {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #0b0d10;
			z-index: 10;
			font-size: 0.8rem;
			color: rgba(232, 236, 241, 0.35);
		}
		#boot[hidden] { display: none !important; }
		#boot.error {
			color: #f66;
			padding: 2rem;
			text-align: center;
			white-space: pre-wrap;
			text-transform: none;
			letter-spacing: 0;
		}
		input[type="file"] { display: none; }
		.rig-edit {
			position: relative;
			width: 100%;
			height: 100%;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.6);
		}
		.rig-edit-hl, .rig-edit-ta {
			font: 12.5px/1.5 ui-monospace, Cascadia Code, Consolas, monospace;
			tab-size: 4;
			white-space: pre;
			word-wrap: normal;
			padding: 0.55rem 0.65rem;
			margin: 0;
			border: none;
		}
		.rig-edit-hl {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			color: #dbe2ea;
		}
		.rig-edit-ta {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			resize: none;
			background: transparent;
			color: transparent;
			caret-color: #e8ecf1;
			outline: none;
			overflow: auto;
		}
		.rig-edit-ta::selection { background: rgba(79, 163, 255, 0.28); }
		.rig-edit:focus-within { outline: 1px solid #4fa3ff; }
		.rig-edit-ro { opacity: 0.6; }
		.tk-k { color: #4fa3ff; }
		.tk-t { color: #4ec9b0; }
		.tk-b { color: #dcdcaa; }
		.tk-s { color: #ce9178; }
		.tk-n { color: #b5cea8; }
		.tk-c { color: #6a9955; font-style: italic; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="tui"></canvas>
		<canvas id="view"></canvas>
		<div id="code-host" hidden></div>
		<div class="host" id="host">
			<button type="button" id="host-open">Open</button>
			<button type="button" id="host-share">Share</button>
		</div>
		<button type="button" id="host-more" aria-label="Show host controls" hidden>· · ·</button>
		<div id="note" hidden></div>
		<div id="empty" hidden>
			<p>Drop a document</p>
		</div>
		<input id="file" type="file" accept=".json,.rig,application/json" />
		<div id="boot">Loading…</div>
	</div>
	<script type="module" src="./app.mjs"></script>
</body>
</html>
