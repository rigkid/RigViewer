<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RigViewer</title>
	<meta name="description" content="Presents a Rig document — the document is the chrome." />
	<script>
		(function () {
			var q = new URLSearchParams(location.search);
			var e = q.get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
			var edit = q.get("edit");
			if (edit === "1" || edit === "true") document.documentElement.classList.add("edit");
			else if (!document.documentElement.classList.contains("embed"))
				document.documentElement.classList.add("doc");
		})();
	</script>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: #0b0d10;
			color: #e8ecf1;
			font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
		}
		#app {
			position: relative;
			width: 100%;
			height: 100%;
		}
		canvas#tui {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 2;
			touch-action: none;
		}
		canvas#view {
			position: absolute;
			z-index: 3;
			display: block;
			background: #050608;
			touch-action: none;
		}
		html.doc canvas#view,
		html.embed canvas#view {
			inset: 0;
			width: 100%;
			height: 100%;
		}
		html.doc canvas#tui {
			z-index: 5;
			pointer-events: none;
		}
		html.embed canvas#tui { display: none; }
		html.embed .host,
		html.embed #empty,
		html.embed #note { display: none !important; }
		html.edit .host,
		html.edit #empty { display: none !important; }
		#code-host {
			position: absolute;
			z-index: 3;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.92);
			border: 1px solid #2a313c;
		}
		html.doc #code-host { z-index: 6; }
		.host {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			z-index: 8;
			display: flex;
			align-items: center;
			gap: 0.45rem;
			padding: 0.45rem 0.65rem;
			background: linear-gradient(to bottom, rgba(11, 13, 16, 0.92), rgba(11, 13, 16, 0));
			pointer-events: none;
		}
		.host > * { pointer-events: auto; }
		.host .brand {
			color: #4fa3ff;
			font-size: 0.78rem;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			margin-right: 0.35rem;
			text-decoration: none;
		}
		.host button,
		.host select,
		.host a.ghost {
			appearance: none;
			border: 1px solid #2a313c;
			background: rgba(13, 16, 21, 0.85);
			color: #e8ecf1;
			font: inherit;
			font-size: 0.78rem;
			padding: 0.28rem 0.55rem;
			border-radius: 4px;
			cursor: pointer;
			text-decoration: none;
		}
		.host button:hover,
		.host select:hover,
		.host a.ghost:hover {
			border-color: #4fa3ff;
			color: #fff;
		}
		.host select { max-width: 9.5rem; }
		.host .spacer { flex: 1; }
		#note {
			position: absolute;
			left: 0.65rem;
			right: 0.65rem;
			bottom: 0.65rem;
			z-index: 8;
			padding: 0.45rem 0.65rem;
			border: 1px solid #2a313c;
			border-radius: 4px;
			background: rgba(13, 16, 21, 0.92);
			font-size: 0.78rem;
			color: #c9d2dc;
		}
		#note.warn { border-color: #b8892d; color: #f0d090; }
		#note.err { border-color: #c44; color: #f88; }
		#empty {
			position: absolute;
			inset: 0;
			z-index: 7;
			display: grid;
			place-content: center;
			gap: 0.75rem;
			text-align: center;
			background: #0b0d10;
			padding: 2rem;
		}
		#empty[hidden] { display: none !important; }
		#empty p {
			margin: 0;
			color: #8b95a1;
			font-size: 0.95rem;
		}
		#empty .hint {
			font-size: 0.78rem;
			color: #5c6570;
		}
		#boot {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #0b0d10;
			z-index: 10;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			font-size: 12px;
			color: #888;
		}
		#boot[hidden] { display: none !important; }
		#boot.error {
			color: #f66;
			padding: 2rem;
			text-align: center;
			white-space: pre-wrap;
			text-transform: none;
			letter-spacing: 0;
		}
		input[type="file"] { display: none; }
		.rig-edit {
			position: relative;
			width: 100%;
			height: 100%;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.6);
		}
		.rig-edit-hl, .rig-edit-ta {
			font: 12.5px/1.5 ui-monospace, Cascadia Code, Consolas, monospace;
			tab-size: 4;
			white-space: pre;
			word-wrap: normal;
			padding: 0.55rem 0.65rem;
			margin: 0;
			border: none;
		}
		.rig-edit-hl {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			color: #dbe2ea;
		}
		.rig-edit-ta {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			resize: none;
			background: transparent;
			color: transparent;
			caret-color: #e8ecf1;
			outline: none;
			overflow: auto;
		}
		.rig-edit-ta::selection { background: rgba(79, 163, 255, 0.28); }
		.rig-edit:focus-within { outline: 1px solid #4fa3ff; }
		.rig-edit-ro { opacity: 0.6; }
		.tk-k { color: #4fa3ff; }
		.tk-t { color: #4ec9b0; }
		.tk-b { color: #dcdcaa; }
		.tk-s { color: #ce9178; }
		.tk-n { color: #b5cea8; }
		.tk-c { color: #6a9955; font-style: italic; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="tui"></canvas>
		<canvas id="view"></canvas>
		<div id="code-host" hidden></div>
		<div class="host" id="host">
			<a class="brand" href="https://rig.works/">RigViewer</a>
			<button type="button" id="host-open">Open</button>
			<button type="button" id="host-share">Share</button>
			<select id="host-examples" aria-label="Examples">
				<option value="">Examples</option>
				<option value="examples/demo-3d.json">3D demo</option>
				<option value="examples/demo-solar.json">Solar system</option>
				<option value="examples/demo-gleditor.json">glEditor</option>
				<option value="examples/minimal-scene.json">2D scene</option>
				<option value="examples/ui-panel.json">UI panel</option>
				<option value="examples/lfo-binding.json">LFO</option>
				<option value="examples/portable-tool.json">Portable tool</option>
			</select>
			<span class="spacer"></span>
			<a class="ghost" id="host-edit" href="?edit=1">Edit</a>
		</div>
		<div id="note" hidden></div>
		<div id="empty" hidden>
			<p>Drop a Rig document here</p>
			<p class="hint">or Open — Viewer presents, Player plays</p>
			<button type="button" id="empty-open">Open</button>
		</div>
		<input id="file" type="file" accept=".json,.rig,application/json" />
		<div id="boot">Loading RigViewer…</div>
	</div>
	<script type="module" src="./app.mjs"></script>
</body>
</html>
