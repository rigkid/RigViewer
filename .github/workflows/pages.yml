name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vendor Three.js and bundle single-file viewer
        run: |
          node tools/vendor-three.mjs
          node tools/bundle.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/examples _site/dist _site/docs _site/web
          # Site root = web viewer (github.io / custom domain).
          cp -R web/. _site/
          # Also mirror under /web/ so local serve and agent URLs with /web/ both work.
          cp -R web/. _site/web/
          cp dist/rigviewer.html _site/dist/rigviewer.html
          cp dist/rigviewer.html _site/rigviewer.html
          cp dist/rigviewer.html _site/web/rigviewer.html
          cp examples/*.json _site/examples/
          mkdir -p _site/web/examples
          cp examples/*.json _site/web/examples/
          cp llms.txt _site/llms.txt
          cp docs/port-map.md docs/ai-share.md docs/README.md _site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

