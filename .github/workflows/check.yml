name: check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vendor, test, bundle
        run: |
          node tools/vendor-three.mjs
          node --test tools/test/*.test.mjs
          node tools/bundle.mjs

